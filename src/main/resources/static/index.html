<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的个人知识库助手</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; }
        #chatBox { border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: auto; margin-bottom: 10px; }
        input { width: 80%; padding: 10px; }
        button { padding: 10px; }
    </style>
</head>
<body>
<h2>我的 AI 助手</h2>
<div id="chatBox">
    <p><strong>AI：</strong>你好！我是你的个人知识库助手，请问你想问什么？（比如：住宿标准是多少？）</p>
</div>
<input type="text" id="msgInput" placeholder="输入你的问题...">
<button onclick="sendMessage()">发送</button>

<script>
    async function sendMessage() {
        const input = document.getElementById("msgInput");
        const chatBox = document.getElementById("chatBox");
        const message = input.value;

        if (!message) return;

        // 1. 把你的问题显示在网页上
        chatBox.innerHTML += `<p><strong>你：</strong>${message}</p>`;
        input.value = ""; // 清空输入框

        try {
            // 2. 向你的 Java 后端发起请求
            const response = await fetch(`/chat?message=${encodeURIComponent(message)}`);
            const text = await response.text();

            // 3. 把 AI 的回答显示在网页上
            chatBox.innerHTML += `<p><strong>AI：</strong>${text}</p>`;
            chatBox.scrollTop = chatBox.scrollHeight; // 自动滚到底部
        } catch (error) {
            chatBox.innerHTML += `<p style="color:red;"><strong>出错了：</strong>${error.message}</p>`;
        }
    }
</script>
</body>
</html>
